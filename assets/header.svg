    <text x="0" y="155" fill="#dc143c" filter="url(#glow)" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="900" letter-spacing="8">SHADOWBLUE</text>
    <text x="4" y="193" fill="#e5e7eb" font-family="Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="8">SOFTWARE ENGINEER</text>
    <path d="M4 214h475" stroke="#7d8590" stroke-opacity=".42"/>
    <text x="4" y="239" fill="#c0c0c0" font-family="Consolas,monospace" font-size="11" letter-spacing="3">SYSTEMS • AUTOMATION • NETWORKS • AI • SOFTWARE</text>
    <g font-family="Consolas,monospace" font-size="10" letter-spacing="2">
      <text x="4" y="282" fill="#ff1744">TURNING IDEAS</text><text x="4" y="296" fill="#ff1744">INTO SYSTEMS</text><text x="4" y="310" fill="#ff1744">THAT WORK.</text>
      <text x="173" y="282" fill="#7d8590">DISCIPLINE</text><text x="173" y="296" fill="#7d8590">CREATES</text><text x="173" y="310" fill="#7d8590">FREEDOM.</text>
    </g>
  </g>

