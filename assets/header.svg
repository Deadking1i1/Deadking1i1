      <path d="M856 136l26 9 15 22 27 10 7 25-16 18-7 33-21 15-14-26-25-12-11-28 12-22z"/>
      <path d="M774 251l23 10 12 28-16 22-22-8-11-23z"/>
    </g>
    <g fill="#ff1744" filter="url(#glow)"><circle class="pulse" cx="767" cy="168" r="3"/><circle class="pulse p2" cx="799" cy="192" r="3"/><circle class="pulse p3" cx="877" cy="166" r="3"/><circle class="pulse" cx="908" cy="202" r="3"/><circle class="pulse p2" cx="884" cy="240" r="3"/></g>
  </g>
  <ellipse cx="828" cy="362" rx="104" ry="14" fill="none" stroke="#626871"/><ellipse cx="828" cy="362" rx="63" ry="7" fill="none" stroke="#dc143c"/>

