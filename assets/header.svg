  <g font-family="Consolas,monospace" font-size="9" letter-spacing="2"><text x="828" y="407" text-anchor="middle" fill="#7d8590">SAME PLANET. HIGHER SYSTEMS.</text><text x="1165" y="178" text-anchor="end" fill="#ff1744">IDEAS</text><text x="1165" y="193" text-anchor="end" fill="#ff1744">SYSTEMS</text><text x="1165" y="208" text-anchor="end" fill="#ff1744">PROGRESS</text></g>
