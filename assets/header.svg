<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Deadking1i1 — ShadowBlue system command center</title>
  <desc id="desc">A black, blood-red, and silver engineering interface with an animated network globe and crimson-core crystal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020303"/><stop offset=".55" stop-color="#090a0c"/><stop offset="1" stop-color="#020202"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".2" stop-color="#858b94"/><stop offset=".43" stop-color="#f4f5f7"/><stop offset=".7" stop-color="#4d5259"/><stop offset=".9" stop-color="#d9dce1"/><stop offset="1" stop-color="#6c727b"/></linearGradient>
    <radialGradient id="sphere" cx="34%" cy="27%"><stop stop-color="#30343a"/><stop offset=".48" stop-color="#0d0f12"/><stop offset="1" stop-color="#010101"/></radialGradient>
    <linearGradient id="crystalA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef0f3" stop-opacity=".65"/><stop offset=".42" stop-color="#15171b" stop-opacity=".9"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="crystalB" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#8d949e" stop-opacity=".55"/><stop offset=".48" stop-color="#090a0c"/><stop offset="1" stop-color="#550010"/></linearGradient>
    <radialGradient id="redFog"><stop stop-color="#dc143c" stop-opacity=".3"/><stop offset="1" stop-color="#8b0000" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#c0c0c0" stroke-opacity=".045"/></pattern>
    <clipPath id="globeClip"><circle cx="828" cy="218" r="124"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .globe-spin{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.orbit-a{transform-box:fill-box;transform-origin:center;animation:spin 19s linear infinite}.orbit-b{transform-box:fill-box;transform-origin:center;animation:reverse 25s linear infinite}.crystal-float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.p2{animation-delay:-1.2s}.p3{animation-delay:-2.4s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}@keyframes float{0%,100%{transform:translateY(-4px) rotate(-1deg)}50%{transform:translateY(6px) rotate(1deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.globe-spin,.orbit-a,.orbit-b,.crystal-float,.pulse{animation:none!important}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="5" fill="url(#bg)" stroke="#59606a"/>
  <rect x="1" y="1" width="1198" height="428" rx="5" fill="url(#grid)"/>
  <ellipse cx="855" cy="215" rx="410" ry="250" fill="url(#redFog)"/>
