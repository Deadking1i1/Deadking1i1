      <ellipse cx="828" cy="218" rx="31" ry="124"/><ellipse cx="828" cy="218" rx="69" ry="124"/><ellipse cx="828" cy="218" rx="103" ry="124"/><path d="M704 218h248M828 94v248"/>
    </g>
