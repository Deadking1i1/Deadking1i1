<svg xmlns="http://www.w3.org/2000/svg" width="590" height="430" viewBox="0 0 590 430" role="img" aria-labelledby="title desc">
  <title id="title">ShadowBlue network globe</title>
  <desc id="desc">A dark rotating holographic globe with silver grid lines, crimson network points, and independently rotating orbital rings.</desc>
  <defs>
    <radialGradient id="sphere" cx="36%" cy="28%">
      <stop stop-color="#2b2e33"/>
      <stop offset=".52" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#010101"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#020202"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="globeClip"><circle cx="295" cy="207" r="140"/></clipPath>
    <style>
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.orbit-a{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}.orbit-b{transform-box:fill-box;transform-origin:center;animation:reverse 25s linear infinite}.pulse{animation:pulse 3.4s ease-in-out infinite}.p2{animation-delay:-1.1s}.p3{animation-delay:-2.2s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.spin,.orbit-a,.orbit-b,.pulse{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="428" rx="8" fill="url(#panel)" stroke="#4c525b"/>
  <path d="M16 62V20h42M532 20h42v42M16 368v42h42M532 410h42v-42" fill="none" stroke="#8b0000" stroke-width="2"/>
  <text x="24" y="41" fill="#dc143c" font-family="Consolas, monospace" font-size="13" letter-spacing="3">ARTIFACT // 01</text>
  <text x="566" y="41" text-anchor="end" fill="#7d8590" font-family="Consolas, monospace" font-size="11" letter-spacing="2">NETWORK ORB</text>
  <g class="orbit-b" fill="none" stroke="#8b0000" stroke-width="2">
    <ellipse cx="295" cy="207" rx="206" ry="54" transform="rotate(-13 295 207)"/>
    <ellipse cx="295" cy="207" rx="187" ry="42" transform="rotate(37 295 207)" opacity=".7"/>
  </g>
  <g class="orbit-a" fill="none" stroke="#ff1744">
    <ellipse cx="295" cy="207" rx="178" ry="73" transform="rotate(18 295 207)" opacity=".65"/>
    <circle cx="126" cy="153" r="4" fill="#ff1744" filter="url(#glow)"/>
  </g>
  <circle cx="295" cy="207" r="144" fill="#8b0000" opacity=".18" filter="url(#glow)"/>
  <circle cx="295" cy="207" r="140" fill="url(#sphere)" stroke="#c0c0c0" stroke-width="2"/>
  <g clip-path="url(#globeClip)" class="spin">
    <g fill="none" stroke="#aab0b8" stroke-opacity=".32">
      <ellipse cx="295" cy="207" rx="140" ry="32"/><ellipse cx="295" cy="207" rx="140" ry="78"/><ellipse cx="295" cy="207" rx="140" ry="112"/>
      <ellipse cx="295" cy="207" rx="34" ry="140"/><ellipse cx="295" cy="207" rx="78" ry="140"/><ellipse cx="295" cy="207" rx="116" ry="140"/>
      <path d="M155 207h280M295 67v280"/>
    </g>
    <g fill="none" stroke="#dc143c" stroke-width="1.6" stroke-linejoin="round" opacity=".9">
      <path d="M198 127l24-19 33 8 11 19 26 9-8 24-27 8-17 31-19-13-18-35-22-10z"/>
      <path d="M327 113l29 10 17 25 30 11 8 28-18 20-8 38-24 17-15-29-28-14-13-32 13-25z"/>
      <path d="M229 245l26 11 14 32-18 25-25-9-13-26z"/>
    </g>
    <g fill="#ff1744" filter="url(#glow)">
      <circle class="pulse" cx="221" cy="150" r="3"/><circle class="pulse p2" cx="257" cy="177" r="3"/><circle class="pulse p3" cx="350" cy="148" r="3"/><circle class="pulse" cx="384" cy="189" r="3"/><circle class="pulse p2" cx="355" cy="231" r="3"/><circle class="pulse p3" cx="241" cy="273" r="3"/>
    </g>
    <g stroke="#8b0000" stroke-width="1" opacity=".8"><path d="M221 150l36 27 93-29 34 41-29 42-114 42" fill="none"/></g>
  </g>
  <ellipse cx="295" cy="372" rx="118" ry="17" fill="none" stroke="#5f656d"/>
  <ellipse cx="295" cy="372" rx="75" ry="9" fill="none" stroke="#dc143c" opacity=".8"/>
  <path d="M245 390h100" stroke="#8b0000" stroke-width="3"/>
  <text x="295" y="413" text-anchor="middle" fill="#c0c0c0" font-family="Consolas, monospace" font-size="11" letter-spacing="3">DRAG • ORBIT • PULSE</text>
</svg>
