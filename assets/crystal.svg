<svg xmlns="http://www.w3.org/2000/svg" width="590" height="430" viewBox="0 0 590 430" role="img" aria-labelledby="title desc">
  <title id="title">ShadowBlue crimson-core crystal</title>
  <desc id="desc">A floating smoked crystal with metallic facets, orbiting fragments, holographic rings, and a softly pulsing blood-red core.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#020202"/></linearGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5e7eb" stop-opacity=".38"/><stop offset=".42" stop-color="#111318" stop-opacity=".82"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#7d8590" stop-opacity=".42"/><stop offset=".55" stop-color="#050505" stop-opacity=".9"/><stop offset="1" stop-color="#3a000b" stop-opacity=".7"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".12" stop-color="#ff1744"/><stop offset=".48" stop-color="#dc143c"/><stop offset="1" stop-color="#8b0000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}.ring-a{transform-box:fill-box;transform-origin:center;animation:spin 17s linear infinite}.ring-b{transform-box:fill-box;transform-origin:center;animation:reverse 23s linear infinite}.frag{transform-box:fill-box;transform-origin:center;animation:drift 7s ease-in-out infinite}.f2{animation-delay:-2.4s}.f3{animation-delay:-4.7s}.core{animation:pulse 3.8s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(-4px) rotate(-1deg)}50%{transform:translateY(7px) rotate(1.5deg)}}@keyframes drift{0%,100%{transform:translate(0,-4px) rotate(0)}50%{transform:translate(5px,7px) rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.float,.ring-a,.ring-b,.frag,.core{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="428" rx="8" fill="url(#panel)" stroke="#4c525b"/>
  <path d="M16 62V20h42M532 20h42v42M16 368v42h42M532 410h42v-42" fill="none" stroke="#8b0000" stroke-width="2"/>
  <text x="24" y="41" fill="#dc143c" font-family="Consolas, monospace" font-size="13" letter-spacing="3">ARTIFACT // 02</text>
  <text x="566" y="41" text-anchor="end" fill="#7d8590" font-family="Consolas, monospace" font-size="11" letter-spacing="2">CRIMSON CORE</text>
  <g class="ring-b" fill="none" stroke="#8b0000" stroke-width="2"><ellipse cx="295" cy="220" rx="168" ry="45" transform="rotate(-14 295 220)"/><ellipse cx="295" cy="220" rx="135" ry="29" transform="rotate(42 295 220)" opacity=".7"/></g>
  <g class="ring-a" fill="none" stroke="#ff1744" opacity=".7"><ellipse cx="295" cy="220" rx="151" ry="55" transform="rotate(17 295 220)"/><circle cx="440" cy="254" r="4" fill="#ff1744" filter="url(#glow)"/></g>
  <g class="frag" fill="url(#facetB)" stroke="#c0c0c0"><path d="M153 140l18-29 11 37-20 24z"/><path d="M426 118l16-26 13 36-22 18z"/></g>
  <g class="frag f2" fill="url(#facetA)" stroke="#7d8590"><path d="M139 278l24-21 4 34-18 18z"/><path d="M443 291l18-28 9 36-20 17z"/></g>
  <g class="frag f3" fill="#150208" stroke="#c0c0c0"><path d="M203 87l12-22 10 29-17 11z"/><path d="M372 340l13-25 12 31-18 14z"/></g>
  <g class="float">
    <ellipse class="core" cx="295" cy="215" rx="54" ry="104" fill="url(#core)" filter="url(#glow)"/>
    <path d="M295 57L228 190l28 119 39 55 39-55 28-119z" fill="url(#facetA)" stroke="#c7cbd1" stroke-width="2"/>
    <path d="M295 57l-9 135 9 172-39-55-28-119z" fill="#07080b" fill-opacity=".82" stroke="#737981"/>
    <path d="M295 57l9 135-9 172 39-55 28-119z" fill="url(#facetB)" stroke="#d7dae0"/>
    <path d="M228 190l58 2 9 172M362 190l-58 2-9 172M228 190l67 38 67-38M256 309l39-81 39 81" fill="none" stroke="#9ba1a9" stroke-opacity=".8"/>
    <path d="M295 118l-17 67 19 22-25 57 23 38M304 143l-12 49 23 31-18 42 12 28" fill="none" stroke="#ff1744" stroke-width="2" filter="url(#glow)"/>
    <path class="core" d="M295 148l-22 69 22 77 23-77z" fill="#dc143c" fill-opacity=".65" stroke="#ff1744" filter="url(#glow)"/>
  </g>
  <ellipse cx="295" cy="374" rx="112" ry="16" fill="none" stroke="#5f656d"/>
  <ellipse cx="295" cy="374" rx="68" ry="8" fill="none" stroke="#dc143c"/>
  <text x="295" y="413" text-anchor="middle" fill="#c0c0c0" font-family="Consolas, monospace" font-size="11" letter-spacing="3">ROTATE • RESONATE • RETURN</text>
</svg>
