name: Validate profile assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate paths, syntax, and assets
        run: npm run validate

      - name: Validate SVG and workflow structure
        run: python scripts/validate.py

      - name: Test repository discovery rules
        run: python -m unittest scripts/test_repository_discovery.py
