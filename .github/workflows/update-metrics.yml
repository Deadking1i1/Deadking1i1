name: Update profile metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Discover repositories and generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Deadking1i1
        run: python scripts/generate_metrics.py

      - name: Commit refreshed assets
        run: |
          if git diff --quiet -- generated data/repositories.json; then
            echo "Metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json generated
          git commit -m "chore: refresh profile data"
          git push
